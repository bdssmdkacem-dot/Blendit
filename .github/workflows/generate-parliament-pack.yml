name: Generate Moroccan Parliament Architecture Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/generate_parliament_pack.py"
      - ".github/workflows/generate-parliament-pack.yml"

permissions:
  contents: read

jobs:
  generate-parliament-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Generate exterior and domed chamber
        run: |
          blender --background --factory-startup --python tools/blender/generate_parliament_pack.py -- --output-dir build/parliament --samples 16

      - name: Validate generated outputs
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          out = Path("build/parliament")
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          expected = {
              "moroccan_parliament_master.blend",
              "parliament_exterior.glb",
              "parliament_domed_chamber.glb",
              "preview_exterior.png",
              "preview_interior.png",
          }
          assert set(manifest["outputs"]) == expected, manifest["outputs"]
          for name in expected:
              p = out / name
              assert p.is_file() and p.stat().st_size > 0, f"Missing/empty output: {name}"
          for name, minimum_nodes in (("parliament_exterior.glb", 80), ("parliament_domed_chamber.glb", 300)):
              p = out / name
              raw = p.read_bytes()
              magic, version, declared_length = struct.unpack("<4sII", raw[:12])
              assert magic == b"glTF" and version == 2 and declared_length == len(raw), name
              json_length, chunk_type = struct.unpack("<I4s", raw[12:20])
              assert chunk_type == b"JSON" and 20 + json_length <= len(raw), f"Invalid GLB JSON chunk: {name}"
              gltf = json.loads(raw[20:20 + json_length].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
              nodes = gltf.get("nodes", [])
              materials = gltf.get("materials", [])
              assert len(nodes) >= minimum_nodes, f"{name}: suspiciously few nodes ({len(nodes)})"
              assert len(materials) >= 6, f"{name}: missing material variety ({len(materials)})"
              assert gltf.get("asset", {}).get("version") == "2.0", f"{name}: invalid asset metadata"
              print(f"{name}: {len(nodes)} nodes, {len(materials)} materials")
          for name in ("preview_exterior.png", "preview_interior.png"):
              raw = (out / name).read_bytes()
              assert raw[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), name
              width, height = struct.unpack(">II", raw[16:24])
              assert width >= 1000 and height >= 700, f"{name}: unexpected preview size {width}x{height}"
              print(f"{name}: {width}x{height}")
          print("Validated manifest, editable BLEND, GLB structure/materials, and preview image dimensions.")
          PY

      - name: Upload parliament pack and visual previews
        uses: actions/upload-artifact@v4
        with:
          name: moroccan-parliament-architecture
          path: build/parliament/
          if-no-files-found: error
          retention-days: 14

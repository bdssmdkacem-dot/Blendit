name: Idriss El Azami Clean-Room Rebuild V3

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/rebuild_idriss_el_azami_clean_v3.py"
      - ".github/workflows/idriss-clean-rebuild-v3.yml"

permissions:
  contents: read

jobs:
  clean-rebuild-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1
      - name: Generate a clean-room character and render review views
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/blender/rebuild_idriss_el_azami_clean_v3.py -- --output-dir build/idriss-clean-v3
      - name: Validate files without equating export success with likeness
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p=Path("build/idriss-clean-v3")
          m=json.loads((p/"manifest.json").read_text())
          assert m["likeness_verified"] is False
          assert m["approval_status"] == "awaiting_actual_render_review"
          for name in m["files"]:
              f=p/name
              assert f.is_file() and f.stat().st_size>0, f"Missing or empty: {name}"
          raw=(p/"idriss_el_azami_clean_v3.glb").read_bytes()
          magic,version,length=struct.unpack("<4sII",raw[:12])
          assert magic==b"glTF" and version==2 and length==len(raw), "Invalid GLB"
          n,kind=struct.unpack("<I4s",raw[12:20])
          assert kind==b"JSON"
          gltf=json.loads(raw[20:20+n].decode("utf8").rstrip(" \\t\\r\\n\\0"))
          assert len(gltf.get("nodes",[]))>=50, f"Unexpectedly sparse export: {len(gltf.get('nodes',[]))}"
          for name in ("front.png","three_quarter.png","profile.png"):
              b=(p/name).read_bytes()
              assert b[:8]==bytes([137,80,78,71,13,10,26,10])
              w,h=struct.unpack(">II",b[16:24]); assert w>=1000 and h>=1000
              print(f"{name}: {w}x{h}, {len(b)} bytes")
          print(f"GLB structure valid; nodes={len(gltf['nodes'])}; visual likeness still unapproved.")
          PY
      - name: Upload scene, export, manifest and rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: idriss-el-azami-clean-v3-review
          path: build/idriss-clean-v3/
          if-no-files-found: error
          retention-days: 30

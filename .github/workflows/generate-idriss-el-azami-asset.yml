name: Generate Idriss El Azami Reference-Led Asset

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/generate_idriss_el_azami_asset.py"
      - ".github/workflows/generate-idriss-el-azami-asset.yml"
      - "source/parliament/references/idriss_el_azami_el_idrissi/**"

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1
      - name: Generate native Blender asset, GLB and actual renders
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/blender/generate_idriss_el_azami_asset.py -- --output-dir build/idriss-el-azami
      - name: Validate exports, camera views, image dimensions and honest review status
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p=Path("build/idriss-el-azami")
          m=json.loads((p/"manifest.json").read_text())
          assert m["real_person_likeness_verified"] is False
          assert m["photo_source_verified"] is False
          assert m["approval_status"] == "ready_for_visual_review_not_approved"
          for name in m["files"]:
              f=p/name
              assert f.is_file() and f.stat().st_size > 0, f"Missing/empty {name}"
          raw=(p/"idriss_el_azami_reference_led.glb").read_bytes()
          magic,version,length=struct.unpack("<4sII",raw[:12])
          assert magic==b"glTF" and version==2 and length==len(raw), "Invalid GLB"
          n,kind=struct.unpack("<I4s",raw[12:20]); assert kind==b"JSON"
          g=json.loads(raw[20:20+n].decode("utf8").rstrip(" \\t\\r\\n\\0"))
          assert len(g.get("nodes",[]))>=80, f"Unexpectedly sparse model: {len(g.get('nodes',[]))} nodes"
          assert len(g.get("materials",[]))>=8, "Expected layered character materials"
          node_names=[n.get("name","") for n in g.get("nodes",[])]
          assert any("RIG | Idriss | full body" in n for n in node_names), "Humanoid armature missing from GLB"
          assert g.get("skins"), "GLB has no skin/armature binding"
          assert g.get("animations"), "GLB has no exported animation"
          print(f"Rig check: {len(g.get('skins',[]))} skin(s), {len(g.get('animations',[]))} animation(s).")
          for view in ("front.png","three_quarter.png","profile.png"):
              b=(p/view).read_bytes()
              assert b[:8]==bytes([137,80,78,71,13,10,26,10]), f"Invalid PNG: {view}"
              w,h=struct.unpack(">II",b[16:24])
              assert w>=1000 and h>=1000, f"Low-resolution render: {view} {w}x{h}"
              print(f"{view}: {w}x{h}, {len(b)} bytes")
          print(f"GLB validated: {len(g.get('nodes',[]))} nodes, {len(g.get('materials',[]))} materials.")
          print("Asset generated; visual approval and real-person likeness remain explicitly unapproved.")
          PY
      - name: Upload Blender project and rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: idriss-el-azami-reference-led-asset-review
          path: build/idriss-el-azami/
          if-no-files-found: error
          retention-days: 30

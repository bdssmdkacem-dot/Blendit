name: Generate Fictional Parliament Satire Characters

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/generate_parliament_satire_characters.py"
      - ".github/workflows/generate-parliament-satire-characters.yml"
      - "data/parliament/real_figure_profiles.json"
      - "tools/blender/validate_parliament_likeness.py"
      - "tests/test_validate_parliament_likeness.py"
      - "docs/parliament-real-figure-caricature-roster.md"

permissions:
  contents: read

jobs:
  generate-character-cast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Validate named-figure reference catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/parliament/real_figure_profiles.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "reference_catalog_only_not_3d_likenesses"
          assert data["global_acceptance"]["require_human_visual_approval"] is True
          profiles = data["profiles"]
          assert len(profiles) >= 4
          ids = [x["id"] for x in profiles]
          assert len(ids) == len(set(ids)), "Duplicate profile IDs"
          for item in profiles:
              for key in ("id", "name_ar", "name_latin", "priority", "reference_page", "reference_status", "sculpt_status", "approval_status"):
                  assert item.get(key), f"{item.get('id', 'unknown')}: missing {key}"
              assert item["sculpt_status"] == "not_started" or item["approval_status"] != "not_reviewed", "Cannot mark sculpt complete without review status"
          print(f"Validated {len(profiles)} source-tracked named-figure profiles; no likeness is falsely marked approved.")
          PY

      - name: Audit real-figure likeness readiness (never infer approval from generic cast)
        run: python3 tools/blender/validate_parliament_likeness.py --json-out build/parliament-likeness-audit.json

      - name: Test likeness audit status and approval gates
        run: python3 -m unittest discover -s tests -p "test_validate_parliament_likeness.py" -v

      - name: Generate fictional cast
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/blender/generate_parliament_satire_characters.py -- --output-dir build/parliament-characters --samples 8

      - name: Validate character assets and visual evidence
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          out = Path("build/parliament-characters")
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          assert len(manifest["characters"]) == 6, "Expected six fictional archetypes"
          assert "not likenesses of real people" in manifest["usage_note"]
          for item in manifest["characters"]:
              for field in ("file", "preview"):
                  p = out / item[field]
                  assert p.is_file() and p.stat().st_size > 0, f"Missing/empty {p.name}"
              raw = (out / item["file"]).read_bytes()
              magic, version, length = struct.unpack("<4sII", raw[:12])
              assert magic == b"glTF" and version == 2 and length == len(raw), item["file"]
              json_length, chunk_type = struct.unpack("<I4s", raw[12:20])
              assert chunk_type == b"JSON" and 20 + json_length <= len(raw), item["file"]
              gltf = json.loads(raw[20:20+json_length].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
              assert len(gltf.get("nodes", [])) >= 35, f"Too few character parts: {item['file']}"
              assert len(gltf.get("materials", [])) >= 5, f"Too few materials: {item['file']}"
              preview = (out / item["preview"]).read_bytes()
              assert preview[:8] == bytes([137,80,78,71,13,10,26,10]), item["preview"]
              width, height = struct.unpack(">II", preview[16:24])
              assert width >= 1000 and height >= 700, item["preview"]
              print(f"{item['id']}: {len(gltf.get('nodes', []))} nodes, {len(gltf.get('materials', []))} materials, preview {width}x{height}")
          print("Validated six GLBs, material variety, and six rendered PNG previews.")
          PY

      - name: Upload cast and preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: fictional-parliament-satire-characters
          path: |
            build/parliament-characters/
            build/parliament-likeness-audit.json
          if-no-files-found: error
          retention-days: 14


  idriss-el-azami-v4:
    name: Independent Idriss V4 rebuild and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Verify reference catalog files exist without changing them
        run: |
          test -s source/parliament/references/idriss_el_azami_el_idrissi/README.md
          test -s source/parliament/references/idriss_el_azami_el_idrissi/idriss_el_azami_el_idrissi_front.jpg
          test -s source/parliament/references/idriss_el_azami_el_idrissi/idriss_el_azami_el_idrissi_profile.jpg
          test -s source/parliament/references/idriss_el_azami_el_idrissi/idriss_el_azami_el_idrissi_three_quarter.jpg
      - name: Generate independent V4 model and actual Blender renders
        run: |
          mkdir -p build/idriss-v4
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python tools/blender/rebuild_idriss_el_azami_professional_v4.py -- --output-dir build/idriss-v4 --samples 24
      - name: Validate GLB structure, multi-view PNGs, and honest approval status
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          out=Path("build/idriss-v4")
          m=json.loads((out/"manifest.json").read_text(encoding="utf-8"))
          assert m["build_generation"]=="independent_rebuild_not_patch_of_v1_v2_v3"
          assert m["approval_status"]=="pending_human_visual_review"
          assert m["likeness_verified"] is False
          assert len(m["outputs"]["renders"])==3
          glb=(out/m["outputs"]["model"]).read_bytes()
          assert glb[:4]==b"glTF" and struct.unpack("<I",glb[4:8])[0]==2
          assert struct.unpack("<I",glb[8:12])[0]==len(glb)
          njson,kind=struct.unpack("<I4s",glb[12:20])
          assert kind==b"JSON"
          data=json.loads(glb[20:20+njson].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
          assert len(data.get("nodes",[]))>=35, f"Insufficient exported geometry nodes: {len(data.get('nodes',[]))}"
          assert len(data.get("materials",[]))>=6, f"Insufficient material variety: {len(data.get('materials',[]))}"
          for name in m["outputs"]["renders"]:
              p=out/name
              assert p.is_file() and p.stat().st_size>10000, f"Missing/suspicious render {name}"
              raw=p.read_bytes()
              assert raw[:8]==bytes([137,80,78,71,13,10,26,10])
              w,h=struct.unpack(">II",raw[16:24])
              assert w==1200 and h==1200, f"Unexpected render dimensions {name}: {w}x{h}"
              print(f"Rendered evidence: {name} {w}x{h} ({p.stat().st_size} bytes)")
          print(f"GLB: {len(data.get('nodes',[]))} nodes, {len(data.get('materials',[]))} materials")
          print("Technical validation passed; visual likeness is explicitly NOT approved by CI.")
          PY
      - name: Upload V4 model and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: idriss-el-azami-professional-rebuild-v4
          path: build/idriss-v4/
          if-no-files-found: error
          retention-days: 14

name: Generate Blender Asset Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/**"
      - ".github/workflows/generate-assets.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test GLB quality audit
        run: python3 tools/blender/test_asset_quality_audit.py

      - name: Install Blender and utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy python3-pil xvfb libegl1 libgl1 libxrender1 libxi6 libxfixes3 libsm6
          blender --version

      - name: Generate procedural asset pack
        run: |
          PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" blender --background --factory-startup --python tools/blender/generate_asset_pack.py -- --output-dir "$GITHUB_WORKSPACE/build/assets"

      - name: Verify generated outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            build/assets/blendit_asset_pack.blend \
            build/assets/blendit_asset_pack.glb \
            build/assets/manifest.json \
            build/assets/preview.png
          do
            test -s "$file"
            echo "Verified: $file ($(stat -c%s "$file") bytes)"
          done
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path
          root = Path("build/assets")
          manifest = json.loads((root / "manifest.json").read_text())
          assert len(manifest["assets"]) >= 5, "Expected at least five starter assets"
          assert all(item["object_count"] > 0 for item in manifest["assets"]), "Empty asset entry found"
          glb = (root / "blendit_asset_pack.glb").read_bytes()
          assert glb[:4] == b"glTF", "GLB magic header is invalid"
          declared_length = struct.unpack("<I", glb[8:12])[0]
          assert declared_length == len(glb), "GLB declared length does not match file size"
          for asset in manifest["assets"]:
              asset_path = root / asset["glb_file"]
              assert asset_path.is_file() and asset_path.stat().st_size > 20, f"Missing individual GLB: {asset_path.name}"
              asset_bytes = asset_path.read_bytes()
              assert asset_bytes[:4] == b"glTF", f"Invalid GLB header: {asset_path.name}"
              assert struct.unpack("<I", asset_bytes[8:12])[0] == len(asset_bytes), f"Invalid GLB length: {asset_path.name}"
              assert asset.get("export_origin") == [0.0, 0.0, 0.0], f"Missing local export origin: {asset_path.name}"
              json_length, json_type = struct.unpack("<II", asset_bytes[12:20])
              assert json_type == 0x4E4F534A, f"Missing GLB JSON chunk: {asset_path.name}"
              gltf = json.loads(asset_bytes[20:20 + json_length].decode("utf-8").rstrip(" \\0"))
              for node in gltf.get("nodes", []):
                  translation = node.get("translation", [0.0, 0.0, 0.0])
                  assert all(abs(value) <= 4.0 for value in translation), (
                      f"Asset seems to retain staging-space coordinates: {asset_path.name}: {translation}"
                  )
          png = (root / "preview.png").read_bytes()
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), "Preview is not a PNG image"
          print("Validated combined GLB, individual asset GLBs/local origins, and PNG preview.")
          print("Manifest check passed:", ", ".join(item["name"] for item in manifest["assets"]))
          PY

      - name: Audit mesh geometry and material assignments
        run: python3 tools/blender/audit_asset_quality.py build/assets

      - name: Import standalone GLBs in Godot 4
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          mkdir -p build/engine-smoke/assets
          cp build/assets/*.glb build/engine-smoke/assets/
          cat > build/engine-smoke/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Blendit Asset Import Smoke Test"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > build/engine-smoke/smoke.gd <<'EOF'
          extends SceneTree

          func _initialize() -> void:
              var scene := Node3D.new()
              scene.name = "BlenditPlaytest"
              root.add_child(scene)

              var world := WorldEnvironment.new()
              var environment := Environment.new()
              environment.background_mode = Environment.BG_COLOR
              environment.background_color = Color(0.12, 0.16, 0.22)
              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color(0.48, 0.52, 0.60)
              environment.ambient_light_energy = 0.7
              world.environment = environment
              scene.add_child(world)

              var sun := DirectionalLight3D.new()
              sun.rotation_degrees = Vector3(-48.0, -32.0, 0.0)
              sun.light_energy = 1.8
              scene.add_child(sun)

              var ground := StaticBody3D.new()
              ground.name = "GroundWithCollision"
              var ground_mesh := MeshInstance3D.new()
              var plane := BoxMesh.new()
              plane.size = Vector3(24.0, 0.3, 16.0)
              ground_mesh.mesh = plane
              ground_mesh.position.y = -0.15
              var ground_material := StandardMaterial3D.new()
              ground_material.albedo_color = Color(0.16, 0.19, 0.22)
              ground_material.roughness = 0.92
              ground_mesh.material_override = ground_material
              ground.add_child(ground_mesh)
              var ground_collision := CollisionShape3D.new()
              var ground_shape := BoxShape3D.new()
              ground_shape.size = plane.size
              ground_collision.shape = ground_shape
              ground_collision.position.y = -0.15
              ground.add_child(ground_collision)
              scene.add_child(ground)

              var camera := Camera3D.new()
              camera.position = Vector3(8.5, 7.5, 10.5)
              camera.fov = 48.0
              camera.basis = Basis.looking_at((Vector3(0.0, 0.3, 0.0) - camera.position).normalized(), Vector3.UP)
              camera.current = true
              scene.add_child(camera)

              var files := DirAccess.get_files_at("res://assets")
              var checked := 0
              var colliders := 0
              for file_name in files:
                  if not file_name.to_lower().ends_with(".glb"):
                      continue
                  var packed := ResourceLoader.load("res://assets/" + file_name) as PackedScene
                  if packed == null:
                      push_error("Godot could not import GLB as PackedScene: " + file_name)
                      quit(1)
                      return
                  var instance := packed.instantiate()
                  if instance == null or instance.get_child_count() == 0:
                      push_error("GLB scene is empty after instantiation: " + file_name)
                      quit(1)
                      return
                  var body := StaticBody3D.new()
                  body.name = file_name.get_basename() + "_CollisionBody"
                  body.position = Vector3(float(checked % 5) * 3.2 - 6.4, 0.0, float(checked / 5) * 3.4 - 1.7)
                  body.add_child(instance)
                  scene.add_child(body)

                  var bounds := AABB()
                  var has_bounds := false
                  var stack: Array[Node] = [instance]
                  while not stack.is_empty():
                      var node: Node = stack.pop_back()
                      for child in node.get_children():
                          stack.append(child)
                      if node is MeshInstance3D and node.mesh != null:
                          var mesh_node := node as MeshInstance3D
                          # Accumulate local transforms without global_transform: this test builds
                          # the scene before the first frame, when nodes are not inside the tree yet.
                          var asset_local_transform: Transform3D = Transform3D.IDENTITY
                          var cursor: Node = mesh_node
                          while cursor != instance:
                              if cursor is Node3D:
                                  asset_local_transform = (cursor as Node3D).transform * asset_local_transform
                              cursor = cursor.get_parent()
                          var mesh_bounds: AABB = asset_local_transform * mesh_node.mesh.get_aabb()
                          bounds = mesh_bounds if not has_bounds else bounds.merge(mesh_bounds)
                          has_bounds = true
                  if has_bounds and bounds.size.length() > 0.01:
                      var shape_node := CollisionShape3D.new()
                      var shape := BoxShape3D.new()
                      shape.size = Vector3(maxf(bounds.size.x, 0.15), maxf(bounds.size.y, 0.15), maxf(bounds.size.z, 0.15))
                      shape_node.shape = shape
                      shape_node.position = bounds.position + bounds.size * 0.5
                      body.add_child(shape_node)
                      colliders += 1
                  checked += 1
                  print("Playtest scene added: ", file_name, " | mesh bounds: ", has_bounds)
              if checked < 5 or colliders < 5:
                  push_error("Expected >=5 imported assets and collision proxies; got assets=" + str(checked) + ", colliders=" + str(colliders))
                  quit(1)
                  return
              print("Godot play-scene test passed: ", checked, " GLBs, ", colliders, " asset collision proxies, lit environment and collidable ground.")
              call_deferred("_capture_visual_playtest", checked, colliders)

          func _capture_visual_playtest(checked: int, colliders: int) -> void:
              # Let Godot finish importing, placing, lighting and drawing the actual assets.
              await process_frame
              await process_frame
              await RenderingServer.frame_post_draw
              var rendered_image: Image = get_root().get_texture().get_image()
              if rendered_image == null or rendered_image.is_empty():
                  push_error("Godot produced an empty playtest viewport image.")
                  quit(1)
                  return
              var workspace: String = OS.get_environment("GITHUB_WORKSPACE")
              if workspace.is_empty():
                  workspace = ProjectSettings.globalize_path("res://../..")
              var screenshot_path: String = workspace.path_join("build/assets/godot-playtest.png")
              var save_error: Error = rendered_image.save_png(screenshot_path)
              if save_error != OK:
                  push_error("Could not save Godot visual playtest screenshot: " + str(save_error))
                  quit(1)
                  return
              print("GODOT_VISUAL_PLAYTEST_OK: screenshot=", screenshot_path,
                    " size=", rendered_image.get_width(), "x", rendered_image.get_height(),
                    " assets=", checked, " colliders=", colliders)
              quit(0)
          EOF
          xvfb-run -a "$GODOT" --audio-driver Dummy --editor --path build/engine-smoke --import
          xvfb-run -a "$GODOT" --audio-driver Dummy --path build/engine-smoke --script res://smoke.gd
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          path = Path("build/assets/godot-playtest.png")
          assert path.is_file() and path.stat().st_size > 10_000, "Godot visual playtest screenshot is missing or implausibly small"
          image = Image.open(path).convert("RGB")
          assert image.width >= 1000 and image.height >= 600, f"Unexpected Godot screenshot dimensions: {image.size}"
          deviation = sum(ImageStat.Stat(image).stddev) / 3
          assert deviation > 8.0, f"Godot screenshot looks blank or uniformly colored (mean channel deviation {deviation:.2f})"
          print(f"Validated rendered Godot playtest: {image.width}x{image.height}, mean channel deviation={deviation:.2f}, bytes={path.stat().st_size}")
          PY

      - name: Upload generated asset pack
        uses: actions/upload-artifact@v4
        with:
          name: blendit-generated-assets
          path: build/assets/
          if-no-files-found: error
          retention-days: 30

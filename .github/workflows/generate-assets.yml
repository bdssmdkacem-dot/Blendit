name: Generate Blender Asset Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/blender/**"
      - ".github/workflows/generate-assets.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libxrender1 libxi6 libxfixes3 libsm6
          blender --version

      - name: Generate procedural asset pack
        run: |
          PYTHONPATH="/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}" blender --background --factory-startup --python tools/blender/generate_asset_pack.py -- --output-dir "$GITHUB_WORKSPACE/build/assets"

      - name: Verify generated outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            build/assets/blendit_asset_pack.blend \
            build/assets/blendit_asset_pack.glb \
            build/assets/manifest.json \
            build/assets/preview.png
          do
            test -s "$file"
            echo "Verified: $file ($(stat -c%s "$file") bytes)"
          done
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path
          root = Path("build/assets")
          manifest = json.loads((root / "manifest.json").read_text())
          assert len(manifest["assets"]) >= 5, "Expected at least five starter assets"
          assert all(item["object_count"] > 0 for item in manifest["assets"]), "Empty asset entry found"
          glb = (root / "blendit_asset_pack.glb").read_bytes()
          assert glb[:4] == b"glTF", "GLB magic header is invalid"
          declared_length = struct.unpack("<I", glb[8:12])[0]
          assert declared_length == len(glb), "GLB declared length does not match file size"
          for asset in manifest["assets"]:
              asset_path = root / asset["glb_file"]
              assert asset_path.is_file() and asset_path.stat().st_size > 20, f"Missing individual GLB: {asset_path.name}"
              asset_bytes = asset_path.read_bytes()
              assert asset_bytes[:4] == b"glTF", f"Invalid GLB header: {asset_path.name}"
              assert struct.unpack("<I", asset_bytes[8:12])[0] == len(asset_bytes), f"Invalid GLB length: {asset_path.name}"
              assert asset.get("export_origin") == [0.0, 0.0, 0.0], f"Missing local export origin: {asset_path.name}"
              json_length, json_type = struct.unpack("<II", asset_bytes[12:20])
              assert json_type == 0x4E4F534A, f"Missing GLB JSON chunk: {asset_path.name}"
              gltf = json.loads(asset_bytes[20:20 + json_length].decode("utf-8").rstrip(" \\0"))
              for node in gltf.get("nodes", []):
                  translation = node.get("translation", [0.0, 0.0, 0.0])
                  assert all(abs(value) <= 4.0 for value in translation), (
                      f"Asset seems to retain staging-space coordinates: {asset_path.name}: {translation}"
                  )
          png = (root / "preview.png").read_bytes()
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]), "Preview is not a PNG image"
          print("Validated combined GLB, individual asset GLBs/local origins, and PNG preview.")
          print("Manifest check passed:", ", ".join(item["name"] for item in manifest["assets"]))
          PY

      - name: Upload generated asset pack
        uses: actions/upload-artifact@v4
        with:
          name: blendit-generated-assets
          path: build/assets/
          if-no-files-found: error
          retention-days: 30
